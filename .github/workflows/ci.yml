name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      # Only the drift check's name-set parity comparison needs the reference
      # repo; it skips cleanly without it, so this is here to get that extra
      # comparison in CI, not because the suite requires it. The sibling path
      # mirrors the local layout (checked out locally as ../ssl-docs).
      - name: Check out starlims-ssl-reference as sibling
        run: git clone --depth 1 https://github.com/mahoskye/starlims-ssl-reference.git ../ssl-docs

      # The rules check resolves each record's enforced_by against the
      # starlims-lsp behavior catalog at the LSP version this repo pins.
      - name: Check out starlims-lsp catalog at the pinned version
        run: |
          tag=$(jq -r .version ssl-mcp-server/lsp-version.json)
          git clone --depth 1 --branch "$tag" https://github.com/mahoskye/starlims-lsp.git ../starlims-lsp

      - name: Install tool dependencies
        working-directory: tools
        run: bun install --frozen-lockfile

      - name: Install MCP server dependencies
        working-directory: ssl-mcp-server
        run: bun install --frozen-lockfile

      - name: TypeScript check
        working-directory: ssl-mcp-server
        run: bun run check

      - name: Consistency checks (data mirror, machine docs, agent adapters)
        working-directory: ssl-mcp-server
        run: bun run check:consistency

      - name: Rules check (records, generated outputs, enforced_by vs LSP catalog)
        run: bun tools/generate-rules.mjs --check --lsp-catalog ../starlims-lsp/catalog
        # Severity disagreements with the LSP catalog are warnings for now (D11).
        # Add --strict-severity here once the open mismatches are resolved
        # (see rules/README.md, "Severity agreement with the LSP"):
        # run: bun tools/generate-rules.mjs --check --lsp-catalog ../starlims-lsp/catalog --strict-severity

      - name: Reference drift check
        run: bun tools/check-reference-drift.mjs

      - name: Agent wiring check (delegation, boundaries, protocols)
        run: bun tools/check-agent-wiring.mjs

      - name: LSP binary fetch smoke test
        working-directory: ssl-mcp-server
        run: |
          bun run fetch-lsp
          ./bin/lsp/starlims-lsp-linux-amd64 --version

      - name: Skill and rule example check (formatted, validates, diagnostics as stated)
        run: bun tools/check-skill-examples.mjs
