name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      # The machine-doc packs embed content from the reference repo, and the
      # drift check compares against it; both need the sibling checkout the
      # local layout provides (checked out locally as ../ssl-docs).
      - name: Check out starlims-ssl-reference as sibling
        run: git clone --depth 1 https://github.com/mahoskye/starlims-ssl-reference.git ../ssl-docs

      - name: Install tool dependencies
        working-directory: tools
        run: bun install --frozen-lockfile

      - name: Install MCP server dependencies
        working-directory: ssl-mcp-server
        run: bun install --frozen-lockfile

      - name: TypeScript check
        working-directory: ssl-mcp-server
        run: bun run check

      - name: Consistency checks (data mirror, machine docs, agent adapters)
        working-directory: ssl-mcp-server
        run: bun run check:consistency

      - name: Reference drift check
        run: bun tools/check-reference-drift.mjs

      - name: LSP binary fetch smoke test
        working-directory: ssl-mcp-server
        run: |
          bun run fetch-lsp
          ./bin/lsp/starlims-lsp-linux-amd64 --version
