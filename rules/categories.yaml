# Machine-pack categories, in pack order.
#
# Every rule record's `categories` must name ids from this list, and
# tools/generate-machine-docs.mjs fails if its CATEGORY_DEFS ids drift from it.
#
# A category with `lists_from_rules: true` takes its must_follow / avoid lists
# from the rule records (by `machine.list`) instead of hard-coded strings.
# `order` lists every record in the category, in the order packs, regions and
# rules/INDEX.md show them.
#
# Generated (#101): every category except files, email and security, whose
# lists are API and security guidance that no domain record states yet; they
# stay hand-written in CATEGORY_DEFS. Labels, aliases, summaries and element
# lists still live in CATEGORY_DEFS.
categories:
  - id: control-flow
    lists_from_rules: true
    order:
      - keyword_uppercase
      - keywords_colon_prefixed
      - condition_keyword_semicolon
      - begincase_requires_case
      - prefer_exitcase
      - exitcase_last_in_branch
      - otherwise_for_default_handling
      - one_statement_per_line
      - statement_semicolon
      - no_semicolon_in_comment_text
      - no_truthy_falsy_coercion
      - label_is_legacy
      - branch_target_label
      - branch_literal_target
      - prefer_positive_logic
      - no_nested_iif
      - limit_block_depth
      - return_early_on_invalid
      - begincase_for_multiway_choice
      - exitcase_after_return
      - no_duplicate_case_branches
      - prefer_linear_success_path
  - id: loops
    lists_from_rules: true
    order:
      - arrays_one_based
      - endfor_invalid
      - step_spacing
      - no_control_exit_in_finally
      - loop_control_inside_loop
      - for_numeric_values
  - id: database
