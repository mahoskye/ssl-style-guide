        - DocGetErrorMessage
        - DocGetFolders
        - DocGetMetadata
        - DocGetTasks
        - DocGetTasksCount
        - DocGetTypeAttributes
        - DocGetTypeAttributesAsDataset
        - DocGetWorkflowStatus
        - DocGetWorkitemProperties
        - DocImportDocument
        - DocInitDocumentumInterface
        - DocLoginToDocumentum
        - DocPauseWorkflow
        - DocRemoveAllUsersFromGroup
        - DocRemoveUsersFromGroup
        - DocRepeatWorkitem
        - DocResumeWorkflow
        - DocSearchAsDataset
        - DocSearchFullText
        - DocSearchUsingDql
        - DocSetMetadata
        - DocStartWorkflow
        - DocStopWorkflow
        - DocUpdateUser
  classes:
    level: authoritative
    signature:
      begin: :CLASS [Name];
      inherit: :INHERIT BaseName; or :INHERIT Category.ScriptName;
      members:
      - :DECLARE ...;
      - :PROCEDURE ...;
      end: null
      notes:
      - Class name is optional in the parser, but explicit names are preferred for maintained code.
      - Constructor must be declared after regular methods.
    methods:
      - :PROCEDURE ...;
    fields:
      - :DECLARE ...;
    properties:
      - object:property syntax
    inheritance:
      single_inheritance: true
      base_class_qualified_names: true
  control_flow:
    syntax:
      level: authoritative
      while_loops: allowed
      loop_control_statements:
        - :EXITFOR
        - :EXITWHILE
        - :LOOP
    style:
      level: style_only
      if_else_style: multiline
      for_loop_style: use :TO and optional :STEP
      case_style: prefer :OTHERWISE
      exitcase_usage: preferred
  error_handling:
    structure:
      level: authoritative
      traditional:
        keywords:
          - :ERROR
          - :RESUME  # optional — switches to resume mode (each statement wrapped in individual try/catch)
        note: "Legacy scope-based error handling. :ERROR applies to all subsequent code in scope. :RESUME causes significant performance cost because each subsequent statement is wrapped individually."
      structured:
        - :TRY
        - body  # requires at least one statement
        - (:CATCH)?
        - handler
        - (:FINALLY body)?
        - :ENDTRY
        # :CATCH and :FINALLY are optional individually, but at least one is required.
        # Bare TRY...ENDTRY without :CATCH or :FINALLY is a compile error.
        # If :FINALLY is present, it must contain at least one statement.
    functions:
      - GetLastSSLError
      - ReturnLastSQLError
      - FormatErrorMessage
      - RaiseError
      - ShowSqlErrors
    guidance:
      level: advisory
      logging_guidance: Log errors with contextual identifiers; avoid swallowing errors silently.
      prefer_structured: true
      traditional_error_blocks: supported
  function_calls:
    direct_calls:
      syntax_level: authoritative
      pattern: FunctionName(arg1, arg2, ...)
      restrictions:
        - Successful direct calls resolve to built-in functions
        - Custom procedures must use DoProc/ExecFunction
      tooling_note: Editor grammars may parse broader identifier calls for navigation and highlighting.
      style_level: style_only
      no_spaces_before_parenthesis: true
    indirect_calls:
      level: authoritative
      pattern: 'DoProc("ProcedureName", {param1, param2})'
      exec_function:
        entry_point: 'ExecFunction("Category.Script", {params})'
        procedure: 'ExecFunction("Category.Script.Proc", {params})'
      parameter_skipping:
        syntax: "{param1,,param3}"
        note: SSL accepts empty slots even though tree-sitter does not model them explicitly
    nested_calls: allowed
    function_resolution: dynamic_dispatch
  property_method_access:
    syntax:
      level: authoritative
      object_syntax: object:property
      method_syntax: object:method(args)
      chaining_style: colon_chained_only
      spaces_around_colon_accepted: true
    formatting:
      level: style_only
      no_spaces_around_colon: preferred
    chaining: allowed
    examples:
      - dataset:Field("COLUMN")
      - form:ShowMessage("text")
      - object:Initialize(params)
  dynamic_code_execution:
    level: authoritative
    indirect_execution:
      - DoProc("ProcedureName", {params})
      - ExecFunction("Category.Script", {params})
      - ExecFunction("Category.Script.Proc", {params})
      - ExecUdf("UdfName", {params})
      - Eval(xCode[, xArg1[, xArg2 ...]])
      - Branch(xTarget)
    dynamic_procedures: GetRegion(cValue, xSrc, xDst, xLocalRegions)
    inline_code: GetInlineCode(cValue, aVariables)
    code_blocks: "{|params| expression}"
  special_literals:
    level: authoritative
    boolean:
      true: .T.
      false: .F.
    null: NIL
    class_context_forms:
      me: "Me"
      base: "Base:Member"
      constructor: ":PROCEDURE Constructor; ... :ENDPROC"
      constructor_note: reserved constructor declaration name inside :CLASS; treat it specially only in that declaration position, not as a standalone constructor literal
    date_functions:
      - CToD("2026-03-05")
      - DateFromNumbers(2026, 3, 5)
      - Today()
      - Now()
    array_literal: "{expr1, expr2, expr3}"
    code_block: "{|param1, param2| expression}"
  database_integration_patterns:
    parameterized_queries:
      named: "SELECT * FROM table WHERE id = ?USER_ID?"
      positional: "SELECT * FROM table WHERE id = ?"
      array_binding: LSearch(query, , , {param1, param2, param3})
    common_patterns:
      - SQLExecute("SELECT field1, field2 FROM table WHERE condition = ?param?")
      - SQLExecute("SELECT ...")
      - RunSQL("INSERT INTO ...")
      - LSearch("SELECT TOP 1 ...")
  performance_guidelines:
    sql_optimization:
      prefer_exists_over_distinct: true
      use_between_for_ranges: true
      avoid_select_star: true
      use_derived_tables: true
      minimize_database_calls: true
    array_operations:
      preallocate_arrays_when_possible: true
      use_appropriate_array_functions: true
    variable_naming:
      hungarian_notation_required: true
      meaningful_names: true
      max_length: 20  # variables, 30 for functions
  security_best_practices:
    sql_injection_prevention:
      always_use_parameters: true
      validate_parameter_count: warn
      sanitize_dynamic_sql: true
    input_validation:
      validate_all_inputs: true
      use_appropriate_data_types: true
    error_information_disclosure:
      avoid_detailed_error_messages: true
      log_detailed_info_server_side: true
  regions:
    comment_regions:
      level: style_only
      usage: Encouraged for organizing and grouping procedures in long files
      syntax: "/* region Name; ... /* endregion;"
      naming: PascalCase with spaces (e.g., /* region Validation Helpers;)
    functional_regions:
      level: authoritative
      usage: "Legacy text storage/retrieval via GetRegion()"
      syntax: ":REGION Name; ... :ENDREGION;"
      note: "Legacy functional body-capture construct used for text retrieval."
  sql:
    api: SQLExecute
    formatting:
      level: style_only
      style: canonicalCompact
      reference: ssl-style-guide/sql-canonical-compact-reference.md
      keyword_case: upper
      function_case: upper
      identifier_case: lower
      preserve_external_casing: true
      align_clauses: false
      comma_style: trailing
      max_line_length: 90
      ssl_embedding:
        indent: 4
        note: entire SQL block indented 4 spaces inside the SSL string literal
      indentation:
        major_clauses: 0
        major_clause_list:
          - SELECT
          - FROM
          - WHERE
          - INNER JOIN
          - LEFT OUTER JOIN
          - RIGHT OUTER JOIN
          - FULL OUTER JOIN
          - CROSS JOIN
          - GROUP BY
          - ORDER BY
          - ORDER SIBLINGS BY
          - UNION
          - UNION ALL
          - INTERSECT
          - MINUS
          - INSERT INTO
          - VALUES
          - DELETE FROM
          - MERGE INTO
          - USING
          - WHEN MATCHED THEN
          - WHEN NOT MATCHED THEN
          - START WITH
          - CONNECT BY
          - PIVOT
          - UNPIVOT
          - FOR UPDATE
          - RETURNING
        sub_clause_indent: 2
        sub_clauses:
          on: 2
          and_or: 2
          having: 2
          case_when_else: 2
        select_continuation_align: first_column
        select_continuation_column: 7
      statement_patterns:
        select:
          columns: pack to ~90 chars; break complex expressions to own line
          continuation: align to first column (col 7)
        join:
          on: indented 2 under JOIN
          on_and: same indent as ON (2 under JOIN)
        where:
          and_or: indented 2 under WHERE
          between_and: aligned under BETWEEN keyword
        group_by:
          having: indented 2 under GROUP BY
        case:
          when_else: indented 2 under CASE
          then_value: inline when short; next line (indented 2 under WHEN) when long
          consistency: all branches inline or all broken within one CASE block
          else_exception: ELSE value may stay inline when short
        insert:
          parens: opening ( on INSERT INTO line; closing ) on own line
          columns: indented 4 inside parens
          values: same block-style parens as column list
        update:
          set: on same line as UPDATE
          assignments: indented 4 under UPDATE SET
        merge:
          on: column 0 (not indented under USING)
          on_and: indented 4 (aligned under first condition inside parens)
          update_set: indented 4 under WHEN MATCHED
          insert: indented 4 under WHEN NOT MATCHED; block-style parens
        set_operations:
          vertical_spacing: blank line before and after operator
        optimizer_hints:
          position: immediately after action keyword
          syntax: "/*+ HINT */"
          note: never strip without understanding purpose
    parameters:
      support_level: authoritative
      named_supported_by:
        - SQLExecute
      positional_supported_by:
        - RunSQL
        - LSearch
        - LSelect
        - LSelect1
        - LSelectC
        - GetDataSet
      note: Only SQLExecute supports ?name? substitution; other DB functions use positional ? with parameter arrays. Current validated behavior has `LSelect` matching `LSelect1` when `aFieldList` is omitted or NIL, while `LSelectC` delegates to `LSelect` and explicit field lists are not implemented in this validated snapshot.
      placeholder_patterns:
      - ?name?
      - ?obj:Prop?
      - ?arr[i]?
      - ?Func()?
      - '?'
      guidance_level: style_only
      prefer_named: true
      validate_count_vs_bindings: warn
      common_patterns:
        select_queries: use SQLExecute
        modification_queries: use RunSQL
        single_value_lookup: use LSearch
        multi_row_lookup: use LSelect1
      functions:
        - SQLExecute
        - RunSQL
        - LSearch
        - LSelect
        - LSelect1
        - LSelectC
        - GetDataSet
        - GetDataSetEx
        - GetDataSetWithSchemaFromSelect
        - GetDataSetXMLFromSelect
        - GetNETDataSet
        - XmlExportSql
        - GetTables
  database_integration:
    parameter_types:
      named: \"?PARAMETER_NAME?\"
      positional: \"?\"
    functions:
      - SQLExecute
      - RunSQL
      - LSearch
      - GetDataSet
      - GetDataSetEx
      - GetDataSetWithSchemaFromSelect
      - GetDataSetXMLFromSelect
      - GetNETDataSet
      - XmlExportSql
      - GetTables
    parameter_hints:
      enabled: true
      patterns:
        - \"?[A-Za-z_][A-Za-z0-9_]*(?:\[[^\]]+\]|:[A-Za-z_][A-Za-z0-9_]*)*\?\"
        - '?'
  object_oriented:
    level: authoritative
    class_definition:
      begin: :CLASS [ClassName];
      inherit: :INHERIT BaseName; or :INHERIT Category.ScriptName;
      end: null  # Class ends with file/module
    property_access:
      syntax_level: authoritative
      syntax: object:property
      chaining_style: colon_chained_only
      spaces_around_colon_accepted: true
      formatting_level: style_only
      no_spaces_around_colon: preferred
    method_call:
      syntax_level: authoritative
      syntax: object:method(args)
      chaining_style: colon_chained_only
      spaces_around_colon_accepted: true
      formatting_level: style_only
      no_spaces_around_colon: preferred
    inheritance:
      single_inheritance: true
      qualified_names: true  # bare or qualified identifiers are accepted; qualified names are common
    object_creation:
      builtin_classes:
        syntax: ClassName{parameters}
        note: Built-in SSL classes use curly braces for instantiation
        all_classes:
          - AzureStorage
          - BatchSupport
          - Email
          - EnterpriseExporter
          - FtpsClient
          - HtmlConverter
          - PatcherSupport
          - PdfSupport
          - RegSetup
          - SDMS
          - SDMSDocUploader
          - SSLBaseDictionary
          - SSLCodeProvider
          - SSLDataset
          - SSLExpando
          - SSLIntDictionary
          - SSLRegex
          - SSLStringDictionary
          - Sequence
          - TablesImport
          - WebServices
        examples:
          - oEmail := Email{};
          - oEmail := Email{.T.};
          - oAzure := AzureStorage{sConnectionName};
          - oDict := SSLStringDictionary{};
          - oRegex := SSLRegex{'\d+'};
        wrong_syntax:
          - ClassName(parameters)  # Wrong - parentheses are for function calls
          - New("ClassName")       # Wrong - not valid SSL syntax
      user_defined_objects:
        syntax:
          - CreateUdObject()
          - CreateUdObject("ClassName")
          - CreateUdObject("ClassName", {params})
        note: CreateUdObject() returns an empty dynamic object; string forms dispatch to objects defined with :CLASS
        examples:
          - oDynamic := CreateUdObject();
          - oCustom := CreateUdObject("MyClass");
          - oCustom := CreateUdObject("MyClass", {param1, param2});
      anonymous_objects:
        syntax: CreateUdObject({{"Prop", value}, {"Other", value2}})
        note: Anonymous UDO with property/value pairs
  string_literals:
    level: authoritative
    formats:
      - double_quotes: "text"
      - single_quotes: 'text'
      - brackets: [text]
    escape_sequences: []  # SSL has no escape sequences; backslashes are literal characters
    escape_note: "Unlike C-family languages, SSL does not interpret backslash sequences. A backslash in a string is a literal backslash."
    database_parameters:
      - ?param?  # named parameters
      - ?        # positional parameters
    sql_within_strings:
      highlight_keywords: true
      parameter_detection: true
  array_operations:
    level: authoritative
    literal_syntax: {expr1, expr2, expr3}
    one_based_indexing: true
    functions:
      - AAdd(array, value)
      - ALen(array)
      - AScan(array, value)
      - AEval(array, function)
      - ArrayNew(size)
      - BuildArray
      - ExtractCol
    access_patterns:
      single: array[index]
      multi: array[index1, index2]
      chained: array[index1][index2]
    empty_slots:
      allowed: true
      syntax: \"{value1,,value3}\"  # skip middle parameter
      note: positional parameter skipping
  lints:
    level: advisory
    style_rules:
      disallow_globals: true
      prefer_positive_logic: true
      no_nested_ternaries: true
      limit_block_depth: 4
      max_params_per_procedure: 8
      require_else_for_if: false
      require_otherwise_in_case: true
    hungarian_notation:
      enabled: true
      strict_mode: true
      prefixes:
        s: string
        n: numeric
        b: boolean
        d: date
        a: array
        o: object
        fn: code_block
        v: variant  # any/variant — for variables whose type is unknown or changes
      exceptions:
        loop_counters: [i, j, k, x, y, z]
        ssl_constants: [NIL, .T., .F.]
        preserve_existing_acronym_casing: true
    security:
      prevent_sql_injection: true
      parameterized_queries_required: true
      validate_database_parameters: warn
    performance:
      prefer_exists_over_distinct: true
      use_between_for_ranges: true
      avoid_select_star: true
    not_preferred_operators:
      - operator: "#"
        severity: info
        message: "Not preferred — use != instead of # for inequality."
        replacement: "!="
      - operator: "<>"
        severity: info
        message: "Not preferred — use != instead of <> for inequality."
        replacement: "!="
    compile_errors:
      level: authoritative
      rules:
      # These mirror current SSL validation rules — catch them early with clear messages
      - rule: exitfor_in_finally
        message: ":EXITFOR inside a :FINALLY block is a compile-time error."
      - rule: exitwhile_in_finally
        message: ":EXITWHILE inside a :FINALLY block is a compile-time error."
      - rule: loop_in_finally
        message: ":LOOP inside a :FINALLY block is a compile-time error."
      - rule: return_in_finally
        message: ":RETURN inside a :FINALLY block is a compile-time error."
      - rule: exitfor_outside_loop
        message: ":EXITFOR must be inside a :FOR loop."
      - rule: exitwhile_outside_loop
        message: ":EXITWHILE must be inside a :WHILE loop."
      - rule: loop_outside_loop
        message: ":LOOP must be inside a :WHILE or :FOR loop."
      - rule: one_class_per_file
        message: "Only one :CLASS definition allowed per file."
      - rule: class_or_script
        message: "A file is either a :CLASS definition or a script, never both."
      - rule: doproc_in_class
        message: "Inside class methods, call sibling/inherited methods with Me:MethodName() / Base:MethodName(). Simple DoProc(\"ProcName\", ...) calls are rejected in class context."
      - rule: constructor_return_value
        message: ":RETURN inside a Constructor cannot return a value."
      - rule: constructor_outside_class
        severity: warning
        message: "Constructor syntax is only meaningful inside a :CLASS definition."
    type_safety:
      - rule: for_numeric_values
        severity: warning
        message: ":FOR loop variable, start, limit, and step must all be numeric. Non-numeric values cause error."
      - rule: dollar_string_only
        severity: warning
        message: "The $ containment operator only works on strings. Non-string operands cause error."
      - rule: nil_in_operations
        severity: warning
        message: "Using NIL in arithmetic or string operations causes error. Use Empty() to check for NIL first."
      - rule: code_block_comparison
        severity: warning
        message: "Code blocks (lambdas) cannot be compared with = or ==. This causes a error."
      - rule: nil_not_empty_string
        severity: info
        message: "NIL is not the same as empty string, zero, or .F. — all declared variables initialize to empty string, not NIL."
      - rule: equals_vs_strict_equals
        severity: info
        message: "For strings, = does prefix matching (returns .T. if left starts with right) while == does exact matching. For other types, both delegate to the same comparison. Prefer == for string comparisons where exact match is needed."
    class_rules:
      - rule: class_member_order
        severity: info
        message: "Tooling enforces the successful class member order used by this guide: :INHERIT, :DECLARE, regular methods, then Constructor."
      - rule: underscore_private_convention
        severity: info
        message: "Underscore-prefixed members (_name) are excluded from reflection — this is the SSL private convention."
      - rule: inherit_qualified_name
        severity: warning
        message: "Qualified :INHERIT names are common, but bare or qualified base names are accepted."
      - rule: max_params_warning
        threshold: 20
        severity: warning
        message: "Procedures with more than 20 parameters generate a warning."
    coding_standards:
      - rule: limit_public_vars
        severity: warning
        message: ":PUBLIC variables persist across all procedures and risk namespace pollution. Prefer :DECLARE with parameter passing."
      - rule: prefer_exitcase
        severity: warning
        message: ":EXITCASE is syntactically optional, but without it later :CASE expressions are still evaluated and additional matching bodies may execute. :OTHERWISE still stays skipped once any earlier case body has run. Always include :EXITCASE unless multi-match behavior is intentional."
      - rule: default_after_parameters
        severity: error
        message: ":DEFAULT must appear immediately after its corresponding :PARAMETERS block."
      - rule: include_at_top
        severity: info
        message: ":INCLUDE is an include directive. Place it at the top of the file for clarity."
  documentation:
    level: style_only
    procedure_headers:
      required: true
      template: |
        /************************************************************
        Description.. : [Brief description of procedure purpose]
        Parameters... : [Parameter descriptions]
        Returns...... : [Return value description]
        Author....... : [Author initials]
        Date......... : YYYY-MM-DD
        ************************************************************;
    code_comments:
      style: SSL_comments  # /* comment; format
      placement: above_code_or_inline
      rules:
        - Explain "why" not "what"
        - Keep concise
        - Use sentence case
        - Terminate with semicolon when the comment itself is a complete SSL comment statement
      types:
        - documentation: for procedures, complex logic
        - inline: for business rules, complex expressions
        - section: for code organization
  module_structure:
    level: style_only
    standard_order:
      - module_header_comment
      - :PARAMETERS (if any)
      - :DEFAULT values (if any)
      - :DECLARE local_variables
      - main_code
      - "/* region sections (optional, for code organization)"
      - procedure_definitions
      - :LABEL statements (if any)
    class_modules:
      - :CLASS [ClassName];
      - :INHERIT BaseName; or :INHERIT Category.ScriptName; (optional)
      - :DECLARE class_fields;
      - :PROCEDURE methods;
      - end: file_end
  language_features:
    version: SSL v11
    case_sensitivity:
      keywords: uppercase_only  # Must be UPPERCASE
      identifiers: case_insensitive
      functions: case_insensitive
    statement_termination:
      all_statements: require_semicolon
      comments: terminate_with_semicolon
      special_cases: []
    data_types:
      implicit: true  # SSL is loosely typed
      style_hint_reference: hungarian_notation
      type_conversion: automatic
  editor_support:
    level: advisory
    code_folding: true
    regions:
      - "/* region description; ... /* endregion; (IDE folding and code organization — recommended)"
      - ":REGION name; ... :ENDREGION; (functional body-capture — NOT for organization)"
    syntax_highlighting:
      keywords: colon_prefixed
      operators: all_types
      literals: boolean_string_number
      comments: block_style
    indentation:
      tab_size: 1
      continuation_indent: 1
      smart_indent: true
  formatter_hints:
    level: style_only
    normalize_keyword_case: true
    align_assignment: 'off'
    wrap_long_lines:
      mode: soft
      break_on:
      - after_comma
      - before_operator
    preserve_comment_blocks: true
  examples:
  - title: IF/ELSE block
    code:
    - :IF bExists;
    - "\ta := a + 1;"
    - :ELSE;
    - "\ta := 0;"
    - :ENDIF;
  - title: Procedure skeleton
    code:
    - :PROCEDURE CalculateTotal;
    - :PARAMETERS nQty, nPrice;
    - :DEFAULT nQty, 1;
    - :TRY;
    - "\tnTotal := nQty * nPrice;"
    - :CATCH;
    - "\t/* handle error;"
    - :ENDTRY;
    - :RETURN nTotal;
    - :ENDPROC;
