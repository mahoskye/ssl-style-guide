  classes:
    level: authoritative
    signature:
      begin: :CLASS [Name];
      inherit: :INHERIT BaseName; or :INHERIT Category.ScriptName;
      members:
      - :DECLARE ...;
      - :PROCEDURE ...;
      end: null
      indentation: top_level  # :CLASS does not increase indent level; class members stay at file-level indentation
      notes:
      - Class name is syntactically optional, but explicit names are preferred for maintained code.
      - Constructor must be declared after regular methods.
    methods:
      - :PROCEDURE ...;
    fields:
      - :DECLARE ...;
    properties:
      - object:property syntax
    inheritance:
      single_inheritance: true
      base_class_qualified_names: true
  control_flow:
    syntax:
      level: authoritative
      while_loops: allowed
      loop_control_statements:
        - :EXITFOR
        - :EXITWHILE
        - :LOOP
    style:
      level: style_only
      if_else_style: multiline
      for_loop_style: use :TO and optional :STEP
      case_style: include :OTHERWISE for default handling  # advisory — :OTHERWISE is not required by the language (blocks.case.constraint requires only at least one :CASE)
      exitcase_usage: end each :CASE/:OTHERWISE with :EXITCASE unless multi-match is intentional
  error_handling:
    structure:
      level: authoritative
      traditional:
        keywords:
          - :ERROR
          - :RESUME  # optional — switches to resume mode (each statement wrapped in individual try/catch)
        note: "Legacy scope-based error handling. :ERROR defines a handler that applies to all subsequent code in the current scope and must contain at least one statement. :RESUME inside the handler switches to resume mode, wrapping each subsequent statement individually — significant performance cost."
      structured:
        - :TRY
        - body  # requires at least one statement
        - (:CATCH handler | :FINALLY body | :CATCH handler :FINALLY body)  # at least one is required; bare TRY...ENDTRY is rejected
        - :ENDTRY
        # Only one :CATCH block is allowed per :TRY — there is no multi-catch.
        # :CATCH body allows zero or more statements (empty CATCH is valid).
        # :FINALLY body requires at least one statement if present.
        # :CATCH does not name the exception — use GetLastSSLError() to retrieve the SSLError object.
        # When both :CATCH and :FINALLY are present, :CATCH must precede :FINALLY.
    functions:
      - GetLastSSLError
      - ClearLastSSLError
      - ReturnLastSQLError
      - FormatErrorMessage
      - FormatSqlErrorMessage
      - RaiseError
      - ShowSqlErrors
    ssl_error_object:
      level: authoritative
      note: "GetLastSSLError() returns an SSLError object with these members:"
      members:
        - ":Message        # short error message"
        - ":Description    # detailed description"
        - ":Operation      # operation that caused the error"
        - ":Code           # numeric error code"
        - ":GenCode        # general/category error code"
        - ":FullDescription      # combined message + description"
        - ":FullDescriptionEx    # extended full description with inner exceptions"
        - ":InnerException       # nested SSLError from a chained exception"
        - ":NETException         # underlying .NET exception object (if available)"
    guidance:
      level: advisory
      logging_guidance: Log errors with contextual identifiers; avoid swallowing errors silently.
      prefer_structured: true
      traditional_error_blocks: supported  # :ERROR/:RESUME remain valid but :TRY/:CATCH/:FINALLY is preferred in new code
  function_calls:
    direct_calls:
      syntax_level: authoritative
      pattern: FunctionName(arg1, arg2, ...)
      restrictions:
        - Successful direct calls resolve to built-in functions
        - Custom procedures must use DoProc/ExecFunction
      tooling_note: Editor grammars may parse broader identifier calls for navigation and highlighting.
      style_level: style_only
      no_spaces_before_parenthesis: true
    indirect_calls:
      level: authoritative
      pattern: 'DoProc("ProcedureName", {param1, param2})'
      class_method_restriction: DoProc is rejected inside class methods; use Me:Method() or Base:Method() instead
      exec_function:
        entry_point: 'ExecFunction("Category.Script", {params})'
        procedure: 'ExecFunction("Category.Script.Proc", {params})'
      parameter_skipping:
        syntax: "{param1,,param3}"
        note: SSL accepts empty slots even though tree-sitter does not model them explicitly
    nested_calls: allowed
    function_resolution: dynamic_dispatch
  property_method_access:
    syntax:
      level: authoritative
      object_syntax: object:property
      method_syntax: object:method(args)
      chaining_style: colon_chained_only
      spaces_around_colon_accepted: true
    formatting:
      level: style_only
      no_spaces_around_colon: preferred
    chaining: allowed
    examples:
      - dataset:Field("COLUMN")
      - form:ShowMessage("text")
      - object:Initialize(params)
  dynamic_code_execution:
    level: authoritative
    indirect_execution:
      - DoProc("ProcedureName", {params})
      - ExecFunction("Category.Script", {params})
      - ExecFunction("Category.Script.Proc", {params})
      - ExecUdf("UdfName", {params})
      - Eval(vCode[, vArg1[, vArg2 ...]])
      - Branch(vTarget)
    dynamic_procedures: GetRegion(sValue, vSrc, vDst)
    inline_code: GetInlineCode(sValue, aVariables)
    code_blocks: "{|params| expression}"
  special_literals:
    level: authoritative
    boolean:
      true: .T.
      false: .F.
    null: NIL
    class_context_forms:
      me: "Me"
      base: "Base:Member"
      constructor: ":PROCEDURE Constructor; ... :ENDPROC"
      constructor_note: reserved constructor declaration name inside :CLASS; treat it specially only in that declaration position, not as a standalone constructor literal
    date_functions:
      - CToD("2026-03-05")
      - DateFromNumbers(2026, 3, 5)
      - Today()
      - Now()
    array_literal: "{expr1, expr2, expr3}"
    code_block: "{|param1, param2| expression}"
  types:
    level: authoritative
    note: "SSL has 8 core value types. Type names are reported by LimsTypeEx() in uppercase (e.g. STRING, NUMBER)."
    core_types:
      array:
        summary: Ordered, 1-based collections of SSL values, including nested arrays.
        runtime_type: ARRAY
        notes:
          - 1-based indexing — first element is aValues[1]
          - May contain mixed value types including NIL and other arrays
          - Empty() returns .T. only when the array has no top-level elements
          - Literal syntax {expr1, expr2, ...}; nested {{...}, {...}}
      boolean:
        summary: Logical true/false values.
        runtime_type: LOGIC
        notes:
          - Two literal values .T. and .F.
          - Strict equality only — comparing to non-boolean types raises a runtime error
          - .AND. and .OR. short-circuit
          - Empty() on a boolean acts as logical negation, not an "uninitialized" check
      codeblock:
        summary: First-class callable expression value.
        runtime_type: CODEBLOCK
        notes:
          - Literal syntax requires at least one parameter and a single-expression body
          - Used with Eval() and higher-order array helpers
      date:
        summary: Calendar value supporting arithmetic, comparison, formatting, and serialization.
        runtime_type: DATE
        notes:
          - No date literal syntax — create via Today(), Now(), CToD(), DateFromNumbers(), StringToDate()
          - Supports adding/subtracting numeric day offsets and date-difference subtraction
          - Not indexable
      netobject:
        summary: Dynamic wrapper for external .NET objects.
        runtime_type: NETOBJECT
        notes:
          - Created via MakeNETObject(), LimsNETConnect(), LimsNETTypeOf()
          - Member access through GetProperty(), SetProperty(), IsProperty(), Invoke()
          - IsEmpty() returns .T. only when the wrapped reference is null
          - AddProperty() is not supported on netobject
      number:
        summary: Single numeric type covering integers and fractional values.
        runtime_type: NUMBER
        notes:
          - All numbers are 64-bit floating-point — no separate integer type
          - Supports arithmetic, comparison, exponentiation (^ or **), and shift (<<, >>) operators
          - Bitwise operations through _AND() / _OR() / _XOR() / _NOT() function calls
          - Scalar — does not support [] indexing
          - Scientific notation requires a decimal point (1.2e-3 valid; 7e2 invalid)
      object:
        summary: SSL value with named members — covers dynamic objects and class instances.
        runtime_type: OBJECT
        notes:
          - Member access via colon syntax (oVal:propName) or GetProperty/SetProperty
          - Created via CreateLocal(), CreateUdObject(), built-in class instantiation Class{}, or user-class CreateUdObject("ClassName")
          - XmlType property controls the root element name used by Serialize()
          - IsEmpty() always returns .F. for objects
          - Direct [] indexing of object members is not supported
      string:
        summary: Text value supporting concatenation, indexing, and JSON serialization.
        runtime_type: STRING
        notes:
          - Three literal forms — double-quoted "text", single-quoted 'text', bracketed [text]
          - 1-based character indexing — sValue[1] returns the first character as a single-character string
          - = is loose/prefix equality; == is strict equality
          - Concatenation via +; trimmed concatenation via -; containment via $
          - Empty() treats NIL, "", and whitespace-only strings as empty
  database_integration_patterns:
    parameterized_queries:
      named: "SELECT * FROM table WHERE id = ?USER_ID?"
      positional: "SELECT * FROM table WHERE id = ?"
      array_binding: LSearch(query,,, {param1, param2, param3})
    common_patterns:
      - SQLExecute("SELECT field1, field2 FROM table WHERE condition = ?param?")
      - SQLExecute("SELECT ...")
      - RunSQL("INSERT INTO ...")
      - LSearch("SELECT TOP 1 ...")
  performance_guidelines:
    sql_optimization:
      prefer_exists_over_distinct: true
      use_between_for_ranges: true
      avoid_select_star: true
      use_derived_tables: true
      minimize_database_calls: true
    array_operations:
      preallocate_arrays_when_possible: true
      use_appropriate_array_functions: true
    variable_naming:
      hungarian_notation_required: true
      meaningful_names: true
      max_length: 20  # variables, 30 for functions
  security_best_practices:
    sql_injection_prevention:
      always_use_parameters: true
      validate_parameter_count: warn
      sanitize_dynamic_sql: true
    input_validation:
      validate_all_inputs: true
      use_appropriate_data_types: true
    error_information_disclosure:
      avoid_detailed_error_messages: true
      log_detailed_info_server_side: true
  regions:
    comment_regions:
      level: style_only
      usage: Encouraged for organizing and grouping procedures in long files
      syntax: "/* region Name; ... /* endregion;"
      naming: Title Case words (e.g., /* region Validation Helpers;)
    functional_regions:
      level: authoritative
      usage: "Legacy text storage/retrieval via GetRegion()"
      syntax: ":REGION Name; ... :ENDREGION;"
      note: "Legacy functional body-capture construct used for text retrieval."
  sql:
    api: SQLExecute
    formatting:
      level: style_only
      style: canonicalCompact
      reference: ssl-style-guide/sql-canonical-compact-reference.md
      keyword_case: upper
      function_case: upper
      identifier_case: lower
      preserve_external_casing: true
      align_clauses: false
      comma_style: trailing   # SQL SELECT-list commas at end of line; unrelated to arrays.allow_trailing_comma
      max_line_length: 90
      ssl_embedding:
        indent: 4
        note: entire SQL block indented 4 spaces inside the SSL string literal
      indentation:
        major_clauses: 0
        major_clause_list:
          - SELECT
          - FROM
          - WHERE
          - INNER JOIN
          - LEFT OUTER JOIN
          - RIGHT OUTER JOIN
          - FULL OUTER JOIN
          - CROSS JOIN
          - GROUP BY
          - ORDER BY
          - ORDER SIBLINGS BY
          - UNION
          - UNION ALL
          - INTERSECT
          - MINUS
          - INSERT INTO
          - VALUES
          - DELETE FROM
          - MERGE INTO
          - USING
          - WHEN MATCHED THEN
          - WHEN NOT MATCHED THEN
          - START WITH
          - CONNECT BY
          - PIVOT
          - UNPIVOT
          - FOR UPDATE
          - RETURNING
        sub_clause_indent: 2
        sub_clauses:
          on: 2
          and_or: 2
          having: 2
          case_when_else: 2
        select_continuation_align: first_column
        select_continuation_column: 7
      statement_patterns:
        select:
          columns: pack to ~90 chars; break complex expressions to own line
          continuation: align to first column (col 7)
        join:
          on: indented 2 under JOIN
          on_and: same indent as ON (2 under JOIN)
        where:
          and_or: indented 2 under WHERE
          between_and: aligned under BETWEEN keyword
        group_by:
          having: indented 2 under GROUP BY
        case:
          when_else: indented 2 under CASE
          then_value: inline when short; next line (indented 2 under WHEN) when long
          consistency: all branches inline or all broken within one CASE block
          else_exception: ELSE value may stay inline when short
        insert:
          parens: opening ( on INSERT INTO line; closing ) on own line
          columns: indented 4 inside parens
          values: same block-style parens as column list
        update:
          set: on same line as UPDATE
          assignments: indented 4 under UPDATE SET
        merge:
          on: column 0 (not indented under USING)
          on_and: indented 4 (aligned under first condition inside parens)
          update_set: indented 4 under WHEN MATCHED
          insert: indented 4 under WHEN NOT MATCHED; block-style parens
        set_operations:
          vertical_spacing: blank line before and after operator
        optimizer_hints:
          position: immediately after action keyword
          syntax: "/*+ HINT */"
          note: never strip without understanding purpose
    parameters:
      support_level: authoritative
      named_supported_by:
        - SQLExecute
      positional_supported_by:
        - RunSQL
        - LSearch
        - LSelect
        - LSelect1
        - LSelectC
        - GetDataSet
      note: Only SQLExecute supports ?name? substitution; other DB functions use positional ? with parameter arrays. Current validated behavior has `LSelect` matching `LSelect1` when `aFieldList` is omitted or NIL, while `LSelectC` delegates to `LSelect` and explicit field lists are not implemented in this validated snapshot.
      array_expansion_caveat: "Array expansion for IN clauses (?arrayVar?) requires a local variable. UDObject array properties used directly (e.g., ?oObj:ArrayProp?) cause runtime error 'The current array has more than 1 dimmension.' — copy to a local variable first. Scalar UDObject properties are not affected."
      placeholder_patterns:
      - ?name?
      - ?obj:Prop?
      - ?arr[i]?
      - ?Func()?
      - '?'
      guidance_level: style_only
      prefer_named: true
      validate_count_vs_bindings: warn
      common_patterns:
        select_queries: use SQLExecute
        modification_queries: use RunSQL
        single_value_lookup: use LSearch
        multi_row_lookup: use LSelect1
      functions:
        - SQLExecute
        - RunSQL
        - LSearch
        - LSelect
        - LSelect1
        - LSelectC
        - GetDataSet
        - GetDataSetEx
        - GetDataSetWithSchemaFromSelect
        - GetDataSetXMLFromSelect
        - GetNETDataSet
        - XmlExportSql
        - GetTables
  object_oriented:
    level: authoritative
    note: "Class definition, inheritance, property/method access rules are defined in the 'classes' and 'property_method_access' sections. This section covers object creation patterns."
    object_creation:
      builtin_classes:
        syntax: ClassName{parameters}
        note: Built-in SSL classes use curly braces for instantiation
        all_classes:
          - AzureStorage
          - BatchSupport
          - CDataColumn
          - CDataColumns
          - CDataField
          - CDataRow
          - CDataTable
          - Email
          - EnterpriseExporter
          - FtpsClient
          - HtmlConverter
          - PatcherSupport
          - PdfSupport
          - RegSetup
          - SDMS
          - SDMSDocUploader
          - SQLConnection
          - SSLBaseDictionary
          - SSLCodeProvider
          - SSLDataset
          - SSLError
          - SSLExpando
          - SSLIntDictionary
          - SSLRegex
          - SSLSQLError
          - SSLStringDictionary
          - Sequence
          - TablesImport
          - WebServices
        examples:
          - oEmail := Email{};
          - oEmail := Email{.T.};
          - oAzure := AzureStorage{sConnectionName};
          - oDict := SSLStringDictionary{};
          - oRegex := SSLRegex{'\d+'};
        wrong_syntax:
          - ClassName(parameters)  # Wrong - parentheses are for function calls
          - New("ClassName")       # Wrong - not valid SSL syntax
      user_defined_objects:
        syntax:
          - CreateUdObject()
          - CreateUdObject("ClassName")
          - CreateUdObject("ClassName", {params})
        note: CreateUdObject() returns an empty dynamic object; string forms dispatch to objects defined with :CLASS
        examples:
          - oDynamic := CreateUdObject();
          - oCustom := CreateUdObject("MyClass");
          - oCustom := CreateUdObject("MyClass", {param1, param2});
      anonymous_objects:
        syntax: CreateUdObject({{"Prop", value}, {"Other", value2}})
        note: Anonymous UDO with property/value pairs
  string_literals:
    level: authoritative
    formats:
      - double_quotes: "text"
      - single_quotes: 'text'
      - brackets: [text]
    escape_sequences: []  # SSL has no escape sequences; backslashes are literal characters
    escape_note: "Unlike C-family languages, SSL does not interpret backslash sequences. A backslash in a string is a literal backslash."
    database_parameters:
      - ?param?  # named parameters
      - ?        # positional parameters
    sql_within_strings:
      highlight_keywords: true
      parameter_detection: true
  array_operations:
    level: authoritative
    literal_syntax: {expr1, expr2, expr3}
    one_based_indexing: true
    functions:
      - AAdd(array, value)
      - ALen(array)
      - AScan(array, value)
      - AEval(array, function)
      - ArrayNew(size)
      - BuildArray
      - ExtractCol
    access_patterns:
      single: array[index]
      multi: array[index1, index2]
      chained: array[index1][index2]
    empty_slots:
      allowed: true
      syntax: "{value1,,value3}"  # skip middle parameter
      note: positional parameter skipping
  lints:
    level: advisory
    style_rules:
      disallow_globals: true
      prefer_positive_logic: true
      no_nested_ternaries: true
      limit_block_depth: 4
      max_params_per_procedure: 8  # style recommendation; STARLIMS warns at 20
      require_else_for_if: false
    hungarian_notation:
      enabled: true
      strict_mode: true
      prefixes:
        s: string
        n: numeric
        b: boolean
        d: date
        a: array
        o: object
        fn: code_block
        v: variant  # any/variant — for variables whose type is unknown or changes
      exceptions:
        loop_counters: [i, j, k, x, y, z]
        ssl_constants: [NIL, .T., .F.]
        preserve_existing_acronym_casing: true
    security:
      prevent_sql_injection: true
      parameterized_queries_required: true
      validate_database_parameters: warn
    performance:
      prefer_exists_over_distinct: true
      use_between_for_ranges: true
      avoid_select_star: true
    not_preferred_operators:
      - operator: "#"
        severity: info
        message: "Not preferred — use != instead of # for inequality."
        replacement: "!="
      - operator: "<>"
        severity: info
        message: "Not preferred — use != instead of <> for inequality."
        replacement: "!="
    compile_errors:
      level: authoritative
      rules:
      # These mirror current SSL validation rules — catch them early with clear messages
      - rule: exitfor_in_finally
        message: ":EXITFOR inside a :FINALLY block is rejected."
      - rule: exitwhile_in_finally
        message: ":EXITWHILE inside a :FINALLY block is rejected."
      - rule: loop_in_finally
        message: ":LOOP inside a :FINALLY block is rejected."
      - rule: return_in_finally
        message: ":RETURN inside a :FINALLY block is rejected."
      - rule: exitfor_outside_loop
        message: ":EXITFOR must be inside a :FOR loop."
      - rule: exitwhile_outside_loop
        message: ":EXITWHILE must be inside a :WHILE loop."
      - rule: loop_outside_loop
        message: ":LOOP must be inside a :WHILE or :FOR loop."
      - rule: one_class_per_file
        message: "Only one :CLASS definition allowed per file."
      - rule: class_or_script
        message: "A file is either a :CLASS definition or a script, never both."
      - rule: doproc_in_class
        severity: error
        message: "DoProc is rejected inside class methods — all forms are rejected. Use Me:MethodName() / Base:MethodName() instead."
      - rule: constructor_return_value
        message: ":RETURN inside a Constructor cannot return a value."
    type_safety:
      - rule: for_numeric_values
        severity: warning
        message: ":FOR loop variable, start, limit, and step must all be numeric. Non-numeric values cause error."
      - rule: dollar_string_only
        severity: warning
        message: "The $ containment operator only works on strings. Non-string operands cause error."
      - rule: nil_in_operations
        severity: warning
        message: "Using NIL in arithmetic or string operations causes error. Use Empty() to check for NIL first."
      - rule: code_block_comparison
        severity: warning
        message: "Code blocks (lambdas) cannot be compared with = or ==. This causes an error."
      - rule: nil_not_empty_string
        severity: info
        message: "NIL is not the same as empty string, zero, or .F. — all declared variables initialize to empty string, not NIL. NIL = NIL is .T., NIL = \"\" is .F."
      - rule: equals_vs_strict_equals
        severity: info
        message: "For strings, = is loose equality (returns .T. if right is empty or if left starts with right) while == does exact matching. != negates == (strict), not = (loose), so = and != are not logical opposites for strings. For other types, both delegate to the same comparison. Prefer == for string comparisons where exact match is needed."
    variable_behavior:
      level: authoritative
      rules:
      - rule: redeclare_is_noop
        message: "Re-declaring an existing variable with :DECLARE is silently ignored — no error, existing value preserved."
      - rule: variable_lookup_order
        message: "Variable lookup: local scope → caller scopes (up call stack) → public variables (:PUBLIC)."
      - rule: numeric_type
        message: "All numbers are stored as 64-bit floating-point (double). There is no separate integer type."
    label_behavior:
      level: authoritative
      token_text: "The token text includes the word LABEL — :LABEL SKIP; produces \"LABEL SKIP\". Branch() targets must include \"LABEL\" in the string."
    parameter_skipping_style:
      level: style_only
      rule: "Skipped-argument commas must be adjacent with no intervening spaces: {param1,,param3} not {param1, , param3}."
      trailing_params: "Omit trailing optional parameters rather than passing empty values."
    class_rules:
      - rule: class_member_order
        severity: info
        message: "Tooling enforces the successful class member order used by this guide: :INHERIT, :DECLARE, regular methods, then Constructor."
      - rule: underscore_private_convention
        severity: info
        message: "Underscore-prefixed members (_name) are excluded from reflection — this is the SSL private convention."
      - rule: inherit_qualified_name
        severity: warning
        message: "Qualified :INHERIT names are common, but bare or qualified base names are accepted."
      - rule: max_params_warning
        threshold: 20
        severity: warning
        message: "Procedures with more than 20 parameters generate a warning."
    coding_standards:
      - rule: limit_public_vars
        severity: warning
        message: ":PUBLIC variables persist across all procedures and risk namespace pollution. Prefer :DECLARE with parameter passing."
      - rule: prefer_exitcase
        severity: warning
        message: ":EXITCASE is syntactically optional, but without it later :CASE expressions are still evaluated and additional matching bodies may execute. :OTHERWISE still stays skipped once any earlier case body has run. Always include :EXITCASE unless multi-match behavior is intentional."
      - rule: parameters_first
        severity: error
        message: ":PARAMETERS must appear before any other statements in a script or procedure body."
      - rule: default_after_parameters
        severity: error
        message: ":DEFAULT must immediately follow :PARAMETERS (zero or more :DEFAULT lines, but only after :PARAMETERS)."
      - rule: include_early
        severity: info
        message: ":INCLUDE is resolved as a textual paste before the rest of the file is read, so its position is technically flexible, but it should appear early to ensure expanded content is available."
      - rule: constructor_outside_class
        severity: warning
        message: "Constructor syntax is only meaningful inside a :CLASS definition."
    deprecated_keywords:
      - keyword: :ERROR
        severity: warning
        message: ":ERROR is legacy error handling. Prefer :TRY/:CATCH/:FINALLY in new and refactored code."
        replacement: ":TRY"
        autofix: false
      - keyword: :RESUME
        severity: warning
        message: ":RESUME is legacy error handling. Prefer :TRY/:CATCH/:FINALLY in new and refactored code."
        replacement: ":TRY"
        autofix: false
      - keyword: :LABEL
        severity: warning
        message: ":LABEL is legacy flow control (used with Branch()). Prefer structured constructs (:IF/:WHILE/:FOR) in new code."
        autofix: false
  documentation:
    level: style_only
    procedure_headers:
      required: true
      template: |  # full formal template — see comments.rules.examples.documentation_header for the compact form
        /* ********************************************************************************
        Description.. : [Brief description of procedure purpose]
        Parameters... : [Parameter descriptions]
        Returns...... : [Return value description]
        Author....... : [Author initials]
        Date......... : YYYY-MM-DD
        ********************************************************************************;
    code_comments:
      style: SSL_comments  # /* comment; format
      placement: above_code_or_inline
      rules:
        - Explain "why" not "what"
        - Keep concise
        - Use sentence case
        - Terminate with semicolon when the comment itself is a complete SSL comment statement
      types:
        - documentation: for procedures, complex logic
        - inline: for business rules, complex expressions
        - section: for code organization
  module_structure:
    level: style_only
    standard_order:
      - module_header_comment
      - :PARAMETERS (if any)
      - :DEFAULT values (if any, immediately after :PARAMETERS)
      - :INCLUDE (if any, early to ensure expanded content is available)
      - :PUBLIC (if any)
      - :DECLARE local_variables
      - main_code
      - "/* region sections (optional, for code organization)"
      - procedure_definitions
      - :LABEL statements (if any)
    declaration_ordering_note: >
      :PARAMETERS must appear before any other statements. :DEFAULT must
      immediately follow :PARAMETERS. :DECLARE and :PUBLIC are regular
      statements and can appear anywhere in the statement flow. :INCLUDE is
      resolved as a textual paste before the rest of the file is read, so its
      position is technically flexible, but it should appear early.
      Recommended conventional order: :PARAMETERS, :DEFAULT, :INCLUDE, :PUBLIC, :DECLARE.
    class_modules:
      - :CLASS [ClassName];
      - :INHERIT BaseName; or :INHERIT Category.ScriptName; (optional — must precede :DECLARE)
      - :DECLARE class_fields; (must follow :INHERIT, must precede methods)
      - :PROCEDURE regular_methods; (must precede Constructor)
      - :PROCEDURE Constructor; (must be last procedure in class)
      - end: file_end  # no :ENDCLASS keyword; class ends at EOF
    class_file_constraint:
      level: authoritative
      rule: one_class_or_script_per_file  # A file is one of: class, script, or data source — never a mix
    data_source_modules:
      level: authoritative
      note: >
        Data source files are preprocessed by server-side builders before SSL compilation.
        They use different parameter syntax and may contain builder-specific directives
        that are not part of the SSL grammar.
      file_types:
        ssl_data_source:
          preprocessor: ssl_data_source_preprocessor
          parameters:
            syntax: ":PARAMETERS p1 := val1, p2 := val2;"
            inline_defaults: true  # := assignment, not separate :DEFAULT
            default_required: true  # every parameter must have a default
            empty_parameters_error: true  # :PARAMETERS; with no params is an error
            rewritten_to: ":PARAMETERS p1, p2; :DEFAULT p1, val1; :DEFAULT p2, val2;"
          structure:
            - header_comment (optional)
            - ":PARAMETERS with inline := defaults"
            - ssl_script_body
        sql_data_source:
          preprocessor: sql_data_source_preprocessor
          parameters:
            syntax: ":PARAMETERS p1 := val1, p2 := val2;"
            inline_defaults: true
            default_required: true
            empty_parameters_error: true
          directives:
            - ":DSN := connectionName;  # database connection"
            - ":TABLENAME := name;  # dataset table name"
            - ":NULLASBLANK := true;  # null-to-blank conversion"
            - ":INVARIANTDATECOLUMNS := col1, col2;  # invariant date columns"
          structure:
            - header_comment (optional)
            - builder_directives (optional)
            - ":PARAMETERS with inline := defaults (optional)"
            - sql_query
          rewritten_to: "SSL script calling GetSSLDataset()"
      lint_rules:
        - rule: no_default_statements_in_datasource
          severity: error
          message: "Data source files use inline := defaults in :PARAMETERS, not separate :DEFAULT statements."
        - rule: no_flag_builder_directives
          severity: info
          message: ":DSN, :TABLENAME, :NULLASBLANK, :INVARIANTDATECOLUMNS are valid builder directives in SQL data source files."
        - rule: datasource_default_required
          severity: error
          message: "Every parameter in a data source :PARAMETERS declaration must have an inline := default value."
  language_features:
    version: SSL v11
    case_sensitivity:
      keywords: uppercase_only  # Must be UPPERCASE
      identifiers: case_insensitive
      functions: case_insensitive
    statement_termination:
      all_statements: require_semicolon
      comments: terminate_with_semicolon
      special_cases: []
    data_types:
      implicit: true  # SSL is loosely typed
      style_hint_reference: hungarian_notation
      type_conversion: automatic
    generic_function_pattern: "[A-Za-z_][A-Za-z0-9_]*\\s*\\("  # regex for recognizing function-name tokens
  editor_support:
    level: advisory
    code_folding: true
    regions:
      - "/* region description; ... /* endregion; (IDE folding and code organization — recommended)"
      - ":REGION name; ... :ENDREGION; (functional body-capture — NOT for organization)"
    syntax_highlighting:
      keywords: colon_prefixed
      operators: all_types
      literals: boolean_string_number
      comments: block_style
    indentation:
      tab_size: 1
      continuation_indent: 1
      smart_indent: true
  formatter_hints:
    level: style_only
    normalize_keyword_case: true
    align_assignment: 'off'
    wrap_long_lines:
      mode: soft
      break_on:
      - after_comma
      - before_operator
    preserve_comment_blocks: true
  examples:
  - title: IF/ELSE block
    code:
    - :IF bExists;
    - "\ta := a + 1;"
    - :ELSE;
    - "\ta := 0;"
    - :ENDIF;
  - title: Procedure skeleton
    code:
    - :PROCEDURE CalculateTotal;
    - :PARAMETERS nQty, nPrice;
    - :DEFAULT nQty, 1;
    - :DECLARE nTotal;
    - :TRY;
    - "\tnTotal := nQty * nPrice;"
    - :CATCH;
    - "\t/* handle error;"
    - :ENDTRY;
    - :RETURN nTotal;
    - :ENDPROC;
