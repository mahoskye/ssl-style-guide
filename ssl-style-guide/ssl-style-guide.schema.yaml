ssl_style_guide:
  metadata:
    title: STARLIMS SSL Style Guide (Tool‑agnostic)
    version: 1.2.0
    maintainers:
    - PaperBull / maho
    sources:
    - ssl.tmLanguage.updated.json
    - tree-sitter-ssl/grammar.js
    - agent-guides/ssl_agent_instructions.md
    notes:
    - This config is deliberately tool‑agnostic. It can be translated to specific
      linters/formatters later.
    - All block keywords are colon‑prefixed and must be UPPERCASE; formatters
      should enforce UPPER.
    - Rules and function lists reflect verified SSL v11 behavior from live environment testing.
    rule_levels:
      authoritative: documented language behavior that must match accepted SSL parsing and execution
      style_only: formatting and readability conventions; configurable by team preference
      advisory: best-practice guidance (security, maintainability, performance)
    ssl_version: v11
    language_completeness: comprehensive
    last_updated: 2026-03-14
  authoritative_language:
    note: Sections marked here should track accepted SSL language behavior.
    sections:
      - keywords
      - blocks
      - expressions
      - declarations
      - procedures.signature
      - procedures.return
      - classes
      - error_handling.structure
      - function_calls
      - property_method_access
      - dynamic_code_execution
      - special_literals
      - sql.parameters
      - object_oriented
      - string_literals
      - array_operations
      - language_features
  style_guidance:
    note: These sections encode repository and refactoring preferences intended to maximize successful SSL authoring.
    sections:
      - files
      - formatting
      - comments.rules
      - naming
      - procedures.order
      - control_flow
      - regions.comment_regions
      - sql.formatting
      - documentation
      - module_structure
      - formatter_hints
      - lints.style_rules
  advisory_guidance:
    note: These sections describe maintainability, security, and performance guidance rather than syntax constraints.
    sections:
      - database_integration_patterns
      - performance_guidelines
      - security_best_practices
      - error_handling.logging_guidance
  files:
    level: style_only
    encoding: utf-8
    line_endings: lf
    max_line_length: 90
    final_newline: true
    one_procedure_per_file: false
    include_order:
      level: style_only
      enforce: true
      rule: top-of-file after header comments; group external before local
  formatting:
    level: style_only
    indent_style: tabs_preferred
    allow_space_indentation: true
    space_indent_width: 4
    indent_width: 1
    continuation_indent: 1
    trim_trailing_whitespace: true
    spaces:
      around_assignment: true
      around_operators: true
      after_comma: true
      before_semicolon: false
      inside_parens: false
      inside_brackets: false
      inside_braces: false
    blank_lines:
      between_top_level_blocks: 1
      before_region: 1
      before_procedure: 1
    statement_terminator: ;
    one_statement_per_line: true
  keywords:
    case: upper
    require_colon_prefix: true
    canonical_forms:
    - :IF
    - :ELSE
    - :ENDIF
    - :WHILE
    - :ENDWHILE
    - :FOR
    - :TO
    - :STEP
    - :NEXT
    - :EXITFOR
    - :EXITWHILE
    - :LOOP
    - :BEGINCASE
    - :CASE
    - :OTHERWISE
    - :ENDCASE
    - :EXITCASE
    - :TRY
    - :CATCH
    - :FINALLY
    - :ENDTRY
    - :DECLARE
    - :DEFAULT
    - :PARAMETERS
    - :PUBLIC
    - :INCLUDE
    - :PROCEDURE
    - :ENDPROC
    - :RETURN
    - :CLASS
    - :INHERIT
    - :REGION
    - :ENDREGION
    - :BEGININLINECODE
    - :ENDINLINECODE
    - :ERROR
    - :RESUME
    - :LABEL
  blocks:
    if:
      begin: :IF
      else: :ELSE
      end: :ENDIF
    while:
      begin: :WHILE
      end: :ENDWHILE
      exit: :EXITWHILE
    for:
      begin: :FOR
      to: :TO
      step: :STEP
      end: :NEXT
      exit: :EXITFOR
      loop: :LOOP
    case:
      begin: :BEGINCASE  # Block opener only — takes no expression
      case: :CASE  # Each :CASE evaluates its own boolean expression; :BEGINCASE is not a value-matching switch
      otherwise: :OTHERWISE  # Only executes when no earlier :CASE body ran
      exit: :EXITCASE  # Without :EXITCASE, later :CASE expressions are still evaluated and additional matching bodies may execute, but :OTHERWISE stays skipped once any case body has run
      end: :ENDCASE
    try:
      begin: :TRY
      catch: :CATCH
      finally: :FINALLY
      end: :ENDTRY
      constraint: at_least_one_of_catch_or_finally  # bare TRY...ENDTRY without :CATCH or :FINALLY is a compile error
    region:
      begin: :REGION
      end: :ENDREGION
      note: "Legacy functional body-capture construct that stores raw text for later retrieval via GetRegion(cValue, xSrc, xDst, xLocalRegions). For editor grouping, prefer comment regions."
    inline_code:
      begin: :BEGININLINECODE
      end: :ENDINLINECODE
      identifier_required: true
      accepted_name_forms:
        - bare_identifier
        - quoted_identifier
      note: "Legacy named code-storage construct that stores a named SSL body for later retrieval via GetInlineCode(cValue, aVariables) / DeleteInlineCode(cValue)."
    error_marker: :ERROR
    label:
      forms:
        - :LABEL Name;
        - :LABELName;
      style_preference: :LABEL Name;
  comments:
    block:
      level: authoritative
      begin: /*
      end: ;
      multiline: true
      preserves_formatting: true
      ssl_specific: true
      description: |
        Comments start with /* and end at the first semicolon.
        Everything between /* and ; is the comment content.
        Newlines and formatting are preserved - no parsing is done.
        A comment can span multiple lines.
    rules:
    - level: style_only
      rule: Begin major sections (procedures, classes, regions) with a short summary.
    - level: style_only
      rule: Use sentence-case and keep comments concise.
    - level: style_only
      rule: Prefer comments that explain 'why' rather than restating 'what'.
    - level: authoritative
      rule: All comments must end with semicolon (SSL requirement).
    - level: authoritative
      rule: "Never include a semicolon inside comment text — it prematurely ends the comment, causing the remaining text to be parsed as executable code."
    - level: authoritative
      rule: "Single-line format: /* comment text here;"
    - level: authoritative
      rule: "Multi-line format: /*\\n  line1\\n  line2\\n;"
    examples:
      single_line: "/* This is a single-line comment;"
      multi_line: |
        /*
        This is a multi-line comment.
        All formatting is preserved.
        ;
      documentation_header: |
        /*
         * Procedure: CalculateTotal
         * Description: Calculates the total from line items
         * Parameters: aItems - array of item values
         * Returns: numeric total
         ;
    types:
      - documentation: for procedures, classes, complex logic
      - inline: for complex expressions, business rules
      - folding: IDE region markers
  naming:
    level: style_only
    case:
      procedures: PascalCase
      classes: PascalCase
      variables: hungarian_camelCase  # prefix + camelCase body, e.g., sUserName, nCount
      constants: UPPER_SNAKE_CASE
    prefixes:
      array: a
      boolean: b
      code_block: fn
      date: d
      numeric: n
      udo: o
      string: s
      variant: v  # any/variant — for variables whose type is unknown or changes
    exceptions:
      loop_counters: [i, j, k, x, y, z]
      preserve_existing_acronym_casing: true
      ssl_constants: [NIL, .T., .F.]
    examples:
      array: aListFolderNo
      boolean: bExists
      date: dDueDate
      numeric: nRunNo
      udo: oOleObject
      string: sUserName
      variant: vResult
    naming_rules:
      procedures: PascalCase
      classes: PascalCase
      variables: hungarian_camelCase  # prefix + camelCase body, e.g., sUserName, nCount
      constants: UPPER_SNAKE_CASE
      max_variable_length: 20
      max_function_length: 30
      use_underscores: discouraged
      single_chars_allowed: [i, j, k]  # loop counters
  expressions:
    operator_spacing: space-around
    operator_symbol_map:
      assignment: ":="
      add_assign: "+="
      subtract_assign: "-="
      multiply_assign: "*="
      divide_assign: "/="
      power_assign: "^="
      modulo_assign: "%="
      plus: "+"
      minus: "-"
      multiply: "*"
      divide: "/"
      power: "^"
      double_star_power: "**"
      modulo: "%"
      increment: "++"
      decrement: "--"
      equals: "="
      strict_equals: "=="
      not_equals: "!="
      not_equals_legacy: "<>"
      hash: "#"
      dollar: "$"
      greater_than: ">"
      greater_than_or_equal: ">="
      less_than: "<"
      less_than_or_equal: "<="
      and: ".AND."
      or: ".OR."
      not: ".NOT."
      unary_not: "!"
      shift_left: "<<"
      shift_right: ">>"
    assignment_operators:
    - :=
    - +=
    - -=
    - '*='
    - '/='
    - '^='
    - '%='
    comparison_operators:
      equality:
      - '='    # loose equality
      - '=='   # strict equality
      inequality:
      - '!='   # not equals
      - '<>'   # not equals
      - '#'    # not equals (alternative syntax)
      relational:
      - '<'    # less than
      - '>'    # greater than
      - '<='   # less than or equal
      - '>='   # greater than or equal
      containment:
      - '$'    # substring containment (left string within right string)
    logical_operators:
    - .AND.
    - .OR.
    - .NOT.
    - '!'     # unary not
    string_operators:
    - '+'  # Use + for string concatenation
    arithmetic_precedence:
    - '^'     # power (also written as **)
    - '**'    # power (alias for ^)
    - '*'
    - /
    - '%'
    - +
    - '-'
    bitwise_operations:
      builtin_functions:
      - _AND(a, b)   # bitwise AND (function call syntax)
      - _OR(a, b)    # bitwise OR (function call syntax)
      - _XOR(a, b)   # bitwise XOR (function call syntax)
      - _NOT(a)      # bitwise NOT (function call syntax)
      shift_operators:
      - "<<"   # left shift
      - ">>"   # right shift
      functions:
      - LimsXOr(val1, val2)  # XOR operation on integers, returns double
      notes: |
        _AND, _OR, _XOR, _NOT use function call syntax: _AND(a, b), not
        a _AND b. They behave like built-in helper calls. << and >> are true
        infix shift operators. LimsXOr is also available as a function.
    boolean_literals:
    - .T.
    - .F.
    nil_literal: NIL
    special_form_map:
      "true": ".T."
      "false": ".F."
      "nil": "NIL"
      me: "Me"
      base: "Base:Member"
      code-block: "{|...| ...}"
      constructor: "Constructor"
    literal_filename_note: "Element doc filenames use word forms (true/false/nil); canonical tokens and reserved special forms are mapped above."
    date_values:
      functions: ["CToD(cDateString)", "DateFromNumbers([xYear[, xMonth[, xDay[, xHour[, xMinute[, xSecond[, xMillisecond[, xMakeInvariant]]]]]]]])", "Today()", "Now()"]
    code_block_literals:
      syntax: "{|params| expression}"
      example: "{|x, y| x + y}"
      lambda_style: true
    numbers:
      allow_scientific: true
      require_decimal_for_scientific: true
      examples:
      - '42'
      - '3.14'
      - '1.2e-3'
      - '9.0E1'
      invalid_examples:
      - '7e2'
      - '.5e1'
      - '9E+1'  # invalid because scientific notation requires a decimal point before the exponent
    indexing:
      arrays: one_based  # First element is at index 1, not 0
      string_positions: one_based
    arithmetic_rules:
      integer_division: use appropriate functions
      floating_point: supported
      overflow_handling: implementation_dependent
    logical_evaluation:
      short_circuit: true
      truth_values: .T. (true), .F. (false)
      nil_evaluates: false
    string_concatenation:
      operator: + (plus)
      implicit_concatenation: false
      use_explicit_plus: true
    strings:
      double: true
      single: true
      bracket: true
      escape_sequences: false  # Backslashes are literal characters in SSL strings
      sql_parameter_hints:
        enabled: true
        patterns:
        - ?NAME?
        - '?'
        lint_missing_parameters: false
    arrays:
      literal_braces: true
      allow_trailing_comma: false
      allow_empty_slots: true
    indexers:
      allow_multi_index: true
      chained_indexers: true
    object_access:
      property_syntax: object:property
      method_syntax: object:method(args)
      space_around_colon: accepted
  declarations:
    declare_rule: :DECLARE a, b, c;
    parameters_rule: :PARAMETERS a, b;
    default_rule: :DEFAULT name, value;
    public_rule: :PUBLIC a, b;
    include_rule: :INCLUDE ScriptName;
  procedures:
    signature:
      level: authoritative
      begin: :PROCEDURE Name;
      parameters: :PARAMETERS var1, var2;
      defaults:
      - :DEFAULT name, value;
      end: :ENDPROC;
    order:
      level: style_only
      sequence:
      - header_comment
      - parameters
      - defaults
      - local_declarations
      - body
      - return
    return:
      keyword: :RETURN
      allow_expression: true
      require_terminal_semicolon: true
    common_functions:
      # Most frequently used functions (1000+ occurrences)
      - SQLExecute
      - DoProc
      - ExecFunction
      - Eval
      - Branch
      - Empty
      - Len
      - UsrMes
      - Chr
      - AAdd
      - AllTrim
      - At
      - Now
      - Today
      
      # High frequency functions (100+ occurrences)
      - CreateUdObject
      - BuildString
      - AScan
      - ALen
      - ArrayCalc
      - BuildArray
      - Directory
      - CreateGUID
      - BuildStringForIn
      - AScanExact
      - Day
      - ArrayNew
      - DateAdd
      - DateDiff
      - Abs
      
    # Function recognition pattern
    generic_function_pattern: "[A-Za-z_][A-Za-z0-9_]*\\s*\\("
    
    # Function naming and casing rules
    naming_conventions:
      description: "SSL functions must use their exact documented casing"
      case_sensitivity: "Functions are case-insensitive but should use documented casing for consistency"
      rules:
        - "Always use the exact casing from the function documentation"
        - "Represent functions in PascalCase where applicable"
        - "Preserve canonical exceptions such as _AND, _OR, _XOR, _NOT, DOW, DOY, and LIMSDate"
        - "Array functions use PascalCase where applicable: AAdd, ALen, AScan, AEval, AFill, ArrayCalc"
        - "String functions use PascalCase where applicable: AllTrim, SubStr, StrTran, Left, Right"
        - "Date functions use PascalCase where applicable: DateAdd, DateDiff, DateFormat, Today, Now"
        - "Database functions use PascalCase where applicable: SQLExecute, RunSQL, GetDataSet"
        - "Type functions use PascalCase where applicable: LimsString, LimsTypeEx, Empty, Val, Chr"
      common_mistakes:
        - wrong: "AADD(arr, val)"
          correct: "AAdd(arr, val)"
          reason: "Function casing exactly matches the documentation (PascalCase)"
        - wrong: "Str(123)"
          correct: "LimsString(123)"
          reason: "Use LimsString for general value-to-string conversion; Str is a separate formatted numeric-output function"
        - wrong: "ALLTRIM(s)"
          correct: "AllTrim(s)"
          reason: "String functions use PascalCase"
        - wrong: "DATEADD(...)"
          correct: "DateAdd(...)"
          reason: "Date functions use PascalCase"
      
    function_categories:
