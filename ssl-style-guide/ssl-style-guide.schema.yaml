ssl_style_guide:
  metadata:
    title: STARLIMS SSL Style Guide (Tool‑agnostic)
    version: 1.3.0
    maintainers:
    - PaperBull / maho
    sources:
    - ssl.tmLanguage.updated.json
    - tree-sitter-ssl/grammar.js
    - agent-guides/ssl_agent_instructions.md
    notes:
    - This config is deliberately tool‑agnostic. It can be translated to specific
      linters/formatters later.
    - All block keywords are colon‑prefixed and must be UPPERCASE; formatters
      should enforce UPPER.
    - Rules and function lists reflect verified SSL v11 behavior from live environment testing.
    - Grammar and formatting rules apply to SSL scripts and class files. Data source
      files (SSL and SQL) are preprocessed before they run and use distinct parameter
      syntax and builder directives — see data_source_modules under module_structure.
    rule_levels:
      authoritative: documented language behavior that must match accepted SSL parsing and execution
      style_only: formatting and readability conventions; configurable by team preference
      advisory: best-practice guidance (security, maintainability, performance)
    ssl_version: v11
    language_completeness: comprehensive
    last_updated: 2026-05-01
  authoritative_language:
    note: Sections marked here should track accepted SSL language behavior.
    sections:
      - keywords
      - blocks
      - expressions
      - declarations
      - procedures.signature
      - procedures.return
      - classes
      - error_handling.structure
      - function_calls
      - property_method_access
      - dynamic_code_execution
      - special_literals
      - sql.parameters
      - object_oriented
      - string_literals
      - array_operations
      - language_features
  style_guidance:
    note: These sections encode repository and refactoring preferences intended to maximize successful SSL authoring.
    sections:
      - files
      - formatting
      - comments.rules
      - naming
      - procedures.order
      - control_flow
      - regions.comment_regions
      - sql.formatting
      - documentation
      - module_structure
      - lints.style_rules
  advisory_guidance:
    note: These sections describe maintainability, security, and performance guidance rather than syntax constraints.
    sections:
      - database_integration_patterns
      - performance_guidelines
      - security_best_practices
      - error_handling.logging_guidance
  files:
    level: style_only
    encoding: utf-8
    line_endings: lf
    max_line_length: 90
    final_newline: true
    one_procedure_per_file: false  # multiple procedures per script file; class files enforce one class per file
    include_order:
      level: style_only
      enforce: true
      rule: after :PARAMETERS/:DEFAULT, before :PUBLIC/:DECLARE; group external before local
  formatting:
    level: style_only
    indent_style: tabs_preferred
    allow_space_indentation: true
    space_indent_width: 4
    indent_width: 1            # 1 tab per nesting level (or 4 spaces when using space indentation)
    continuation_indent: 1     # 1 tab (or 4 spaces) for continuation lines
    trim_trailing_whitespace: true
    spaces:
      around_assignment: true
      around_operators: true
      after_comma: true
      before_semicolon: false
      before_step_keyword: true  # :FOR i := 1 :TO 10 :STEP 2; (space before :STEP)
      inside_parens: false
      inside_brackets: false
      inside_braces: false
    blank_lines:
      between_top_level_blocks: 1
      before_region: 1
      before_procedure: 1
    statement_terminator: ;
    one_statement_per_line: true
  keywords:
    case: upper
    require_colon_prefix: true
    canonical_forms:
    - :IF
    - :ELSE
    - :ENDIF
    - :WHILE
    - :ENDWHILE
    - :FOR
    - :TO
    - :STEP
    - :NEXT
    - :EXITFOR
    - :EXITWHILE
    - :LOOP
    - :BEGINCASE
    - :CASE
    - :OTHERWISE
    - :ENDCASE
    - :EXITCASE
    - :TRY
    - :CATCH
    - :FINALLY
    - :ENDTRY
    - :DECLARE
    - :DEFAULT
    - :PARAMETERS
    - :PUBLIC
    - :INCLUDE
    - :PROCEDURE
    - :ENDPROC
    - :RETURN
    - :CLASS
    - :INHERIT
    - :REGION
    - :ENDREGION
    - :BEGININLINECODE
    - :ENDINLINECODE
    - :ERROR
    - :RESUME
    - :LABEL
  blocks:
    if:
      begin: :IF
      else: :ELSE
      end: :ENDIF
    while:
      begin: :WHILE
      end: :ENDWHILE
      exit: :EXITWHILE
      loop: :LOOP  # :LOOP works in both :FOR and :WHILE loops
    for:
      begin: :FOR
      to: :TO
      step: :STEP
      end: :NEXT  # :ENDFOR is reserved but NOT usable — writing it is rejected as a syntax error
      exit: :EXITFOR
      loop: :LOOP
      semantics: ":TO limit and :STEP expressions are evaluated once before the loop starts. Loop continues while var <= limit (step >= 0) or var >= limit (step < 0). :STEP 0 produces a non-terminating loop if the initial condition is true."
    case:
      begin: :BEGINCASE  # Block opener only — takes no expression
      case: :CASE  # Each :CASE evaluates its own boolean expression; :BEGINCASE is not a value-matching switch
      otherwise: :OTHERWISE  # Only executes when no earlier :CASE body ran
      exit: :EXITCASE  # Without :EXITCASE, later :CASE expressions are still evaluated and additional matching bodies may execute, but :OTHERWISE stays skipped once any case body has run
      end: :ENDCASE
      constraint: at_least_one_case  # :BEGINCASE requires at least one :CASE block
    try:
      begin: :TRY
      catch: :CATCH
      finally: :FINALLY
      end: :ENDTRY
      constraint: at_least_one_of_catch_or_finally  # bare TRY...ENDTRY without :CATCH or :FINALLY is rejected
    region:
      begin: :REGION
      end: :ENDREGION
      note: "Legacy functional body-capture construct that stores raw text for later retrieval via GetRegion(sValue, vSrc, vDst). For editor grouping, prefer comment regions."
    inline_code:
      begin: :BEGININLINECODE
      end: :ENDINLINECODE
      identifier_required: true
      accepted_name_forms:
        - bare_identifier
        - quoted_identifier
      note: "Legacy named code-storage construct that stores a named SSL body for later retrieval via GetInlineCode(sValue, aVariables) / DeleteInlineCode(sValue)."
    error:
      marker: :ERROR
      resume: :RESUME  # optional — switches to resume mode inside :ERROR handler
      note: "Legacy scope-based handler. :ERROR body requires ≥1 statement. :RESUME wraps each subsequent statement in individual try/catch."
    class:
      begin: :CLASS
      end: null  # no :ENDCLASS — class ends at EOF
      note: "A class file contains only the class definition; it ends at end-of-file."
    label:
      forms:
        - :LABEL Name;
        - :LABELName;
      style_preference: :LABEL Name;
  comments:
    block:
      level: authoritative
      begin: /*
      end: ;
      multiline: true
      preserves_formatting: true
      ssl_specific: true
      description: |
        Comments start with /* and end at the first semicolon.
        Everything between /* and ; is the comment content.
        Newlines and formatting are preserved - no parsing is done.
        A comment can span multiple lines.
    rules:
    - level: style_only
      rule: Begin major sections (procedures, classes, regions) with a short summary.
    - level: style_only
      rule: Use sentence-case and keep comments concise.
    - level: style_only
      rule: Prefer comments that explain 'why' rather than restating 'what'.
    - level: authoritative
      rule: All comments must end with semicolon (SSL requirement).
    - level: authoritative
      rule: "Never include a semicolon inside comment text — it prematurely ends the comment, causing the remaining text to be parsed as executable code."
    - level: authoritative
      rule: "Single-line format: /* comment text here;"
    - level: authoritative
      rule: "Multi-line format: /*\\n  line1\\n  line2\\n;"
    examples:
      single_line: "/* This is a single-line comment;"
      multi_line: |
        /*
        This is a multi-line comment.
        All formatting is preserved.
        ;
      documentation_header: |  # compact form — see documentation.procedure_headers for the full formal template
        /*
         * Procedure: CalculateTotal
         * Description: Calculates the total from line items
         * Parameters: aItems - array of item values
         * Returns: numeric total
         ;
    types:
      - documentation: for procedures, classes, complex logic
      - inline: for complex expressions, business rules
      - folding: IDE region markers
  naming:
    level: style_only
    see: lints.hungarian_notation  # authoritative prefix/exception config
    procedures: PascalCase
    classes: PascalCase
    variables: hungarian_camelCase  # prefix + camelCase body, e.g., sUserName, nCount
    constants: UPPER_SNAKE_CASE
    length_limits:
      variable_body_max: 20
      procedure_name_max: 30
    use_underscores: discouraged  # in variable/procedure names; file-level suffixes (_Core, _Batch, etc.) are standard
  expressions:
    operator_spacing: space-around
    operator_symbol_map:
      assignment: ":="
      add_assign: "+="
      subtract_assign: "-="
      multiply_assign: "*="
      divide_assign: "/="
      power_assign: "^="
      modulo_assign: "%="
      plus: "+"
      minus: "-"
      multiply: "*"
      divide: "/"
      power: "^"
      double_star_power: "**"
      modulo: "%"
      increment: "++"
      decrement: "--"
      equals: "="
      strict_equals: "=="
      not_equals: "!="
      not_equals_legacy: "<>"
      hash: "#"
      dollar: "$"
      greater_than: ">"
      greater_than_or_equal: ">="
      less_than: "<"
      less_than_or_equal: "<="
      and: ".AND."
      or: ".OR."
      not: ".NOT."
      unary_not: "!"
      shift_left: "<<"
      shift_right: ">>"
    assignment_operators:
    - :=
    - +=
    - -=
    - '*='
    - '/='
    - '^='
    - '%='
    # Full precedence (low → high): .OR., .AND., equality/containment, relational,
    # shift, additive, multiplicative, power (right-assoc), unary.
    # See ssl-ebnf-grammar.md for the canonical production chain.
    comparison_operators:
      equality:                    # precedence: same level as containment (below relational)
      - '='    # loose equality (for strings: .T. if right is empty or left starts with right; for other types: exact match)
      - '=='   # strict equality (exact match)
      inequality:                  # precedence: same level as equality
      - '!='   # not equals (negates ==, not =)
      - '<>'   # not equals (equivalent to !=)
      - '#'    # not equals (equivalent to !=)
      relational:                  # precedence: above equality/containment
      - '<'    # less than
      - '>'    # greater than
      - '<='   # less than or equal
      - '>='   # greater than or equal
      containment:                 # precedence: same level as equality (below relational)
      - '$'    # substring containment (left string within right string)
    logical_operators:
    - .AND.
    - .OR.
    - .NOT.
    - '!'     # unary not
    string_operators:
    - '+'  # Use + for string concatenation
    - '-'  # Trims trailing spaces from left operand, then concatenates
    arithmetic_precedence:
      power: ['^', '**']           # highest — right-associative
      multiplicative: ['*', '/', '%']  # same level, left-to-right
      additive: ['+', '-']         # lowest arithmetic, left-to-right
    bitwise_operations:
      builtin_functions:
      - _AND(a, b)   # bitwise AND (function call syntax)
      - _OR(a, b)    # bitwise OR (function call syntax)
      - _XOR(a, b)   # bitwise XOR (function call syntax)
      - _NOT(a)      # bitwise NOT (function call syntax)
      shift_operators:
      - "<<"   # left shift
      - ">>"   # right shift
      functions:
      - LimsXOr(val1, val2)  # XOR operation on integers, returns double
      notes: |
        _AND, _OR, _XOR, _NOT use function call syntax: _AND(a, b), not
        a _AND b. They behave like built-in helper calls. << and >> are true
        infix shift operators. LimsXOr is also available as a function.
    boolean_literals:
    - .T.
    - .F.
    nil_literal: NIL
    special_form_map:
      "true": ".T."
      "false": ".F."
      "nil": "NIL"
      me: "Me"
      base: "Base:Member"
      code-block: "{|...| ...}"
      constructor: "Constructor"
    literal_filename_note: "Element doc filenames use word forms (true/false/nil); canonical tokens and reserved special forms are mapped above."
    date_values:
      functions: ["CToD(sDateString)", "DateFromNumbers([vYear[, vMonth[, vDay[, vHour[, vMinute[, vSecond[, vMillisecond[, vMakeInvariant]]]]]]]])", "Today()", "Now()"]
      note: Brace-delimited forms such as "{2026, 3, 23}" are arrays, not date literals.
    code_block_literals:
      syntax: "{|params| expression}"
      example: "{|x, y| x + y}"
      lambda_style: true
      min_parameters: 1  # at least one bound variable is required
      body: single_expression  # body is a single expression, not multiple statements
    numbers:
      allow_scientific: true
      require_decimal_for_scientific: true
      examples:
      - '42'
      - '3.14'
      - '1.2e-3'
      - '9.0E1'
      invalid_examples:
      - '7e2'
      - '.5e1'
      - '9E+1'  # invalid because (a) scientific notation requires a decimal point before the exponent, and (b) explicit plus signs in the exponent are not supported
    indexing:
      arrays: one_based  # First element is at index 1, not 0
      string_positions: one_based
    arithmetic_rules:
      integer_division: use appropriate functions
      floating_point: supported
      overflow_handling: implementation_dependent
    logical_evaluation:
      short_circuit: true
      truth_values: .T. (true), .F. (false)
      nil_evaluates: false
    string_concatenation:
      operator: + (plus)
      implicit_concatenation: false
      use_explicit_plus: true
    strings:
      double: true
      single: true
      bracket: true
      escape_sequences: false  # Backslashes are literal characters in SSL strings
      sql_parameter_hints:
        enabled: true
        patterns:
        - ?NAME?
        - '?'
        lint_missing_parameters: false
    arrays:
      literal_braces: true
      allow_trailing_comma: false
      allow_empty_slots: true
    indexers:
      allow_multi_index: true
      chained_indexers: true
    object_access:
      property_syntax: object:property
      method_syntax: object:method(args)
      space_around_colon: accepted
  declarations:
    declare_rule: :DECLARE a, b, c;
    parameters_rule: :PARAMETERS a, b;
    default_rule: :DEFAULT name, value;
    public_rule: :PUBLIC a, b;
    include_rule: :INCLUDE ScriptName;
  procedures:
    signature:
      level: authoritative
      begin: :PROCEDURE Name;
      parameters: :PARAMETERS var1, var2;
      defaults:
      - :DEFAULT name, value;
      end: :ENDPROC;
    order:
      level: style_only
      sequence:
      - header_comment
      - parameters
      - defaults
      - local_declarations
      - body
      - return
    visibility_annotations:
      level: authoritative
      syntax:
        - "/*@private;"
        - "/*@protected;"
      placement: own line immediately before :PROCEDURE
      effect: "Both make the procedure inaccessible via DoProc/ExecFunction"
      class_restriction: "These annotations have no effect on class methods — class methods are always Public|Virtual"
    return:
      keyword: :RETURN
      allow_expression: true
      require_terminal_semicolon: true
    common_functions:
      # Most frequently used functions (1000+ occurrences)
      - SQLExecute
      - DoProc
      - ExecFunction
      - Eval
      - Branch
      - Empty
      - Len
      - UsrMes
      - Chr
      - AAdd
      - AllTrim
      - At
      - Now
      - Today

      # High frequency functions (100+ occurrences)
      - CreateUdObject
      - BuildString
      - AScan
      - ALen
      - ArrayCalc
      - BuildArray
      - Directory
      - CreateGUID
      - BuildStringForIn
      - AScanExact
      - Day
      - ArrayNew
      - DateAdd
      - DateDiff
      - Abs

    # Function naming and casing rules
    naming_conventions:
      description: "SSL functions must use their exact documented casing"
      case_sensitivity: "Functions are case-insensitive but should use documented casing for consistency"
      rules:
        - "Always use the exact casing from the function documentation"
        - "Represent functions in PascalCase where applicable"
        - "Preserve canonical exceptions such as _AND, _OR, _XOR, _NOT, DOW, DOY, and LIMSDate"
        - "Array functions use PascalCase where applicable: AAdd, ALen, AScan, AEval, AFill, ArrayCalc"
        - "String functions use PascalCase where applicable: AllTrim, SubStr, StrTran, Left, Right"
        - "Date functions use PascalCase where applicable: DateAdd, DateDiff, DateFormat, Today, Now"
        - "Database functions use PascalCase where applicable: SQLExecute, RunSQL, GetDataSet"
        - "Type functions use PascalCase where applicable: LimsString, LimsTypeEx, Empty, Val, Chr"
      common_mistakes:
        - wrong: "AADD(arr, val)"
          correct: "AAdd(arr, val)"
          reason: "Function casing exactly matches the documentation (PascalCase)"
        - wrong: "LIMSSTRING(value)"
          correct: "LimsString(value)"
          reason: "Type/helper functions use documented casing"
        - wrong: "ALLTRIM(s)"
          correct: "AllTrim(s)"
          reason: "String functions use PascalCase"
        - wrong: "DATEADD(...)"
          correct: "DateAdd(...)"
          reason: "Date functions use PascalCase"

    # Functions may appear in multiple categories when they span domains
    # (e.g., FTP functions in both file_operations and ftp_operations).
    function_categories:
      string_operations:
        - AllTrim
        - At
        - Left
        - Right
        - SubStr
        - StrTran
        - Upper
        - Lower
        - Trim
        - LimsString
